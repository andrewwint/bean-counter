[project]
name = "bean-counter-analytics"
version = "0.1.0"
description = "Where did the coffee go? Shrinkage analysis over the bean-counter event log."
readme = "README.md"
# Upper bound is deliberate, not a guess: psutil (pulled in by jupyter/ipykernel) does not
# reliably support 3.14 on macOS yet, and picking it up silently breaks kernel startup with
# a "seems to be overriding built-in modules" error that has nothing to do with this repo's
# code. .python-version pins 3.13 for the same reason -- keep both in sync.
requires-python = ">=3.12,<3.14"

dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "matplotlib>=3.9",
    "jupyter>=1.1",
    "duckdb>=1.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Deliberately optional. The notebook's default read path is an exported snapshot under
# analytics/data/, NOT a live application-database connection -- see README.md, "The read path".
# psycopg is installed only for the export step, and only when someone opts in.
db = ["psycopg[binary]>=3.2"]

[tool.uv]
package = false
