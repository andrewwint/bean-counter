[project]
name = "bean-counter-analytics"
version = "0.1.0"
description = "Where did the coffee go? Shrinkage analysis over the bean-counter event log."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "matplotlib>=3.9",
    "jupyter>=1.1",
    "duckdb>=1.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Deliberately optional. The notebook's default read path is an exported snapshot under
# analytics/data/, NOT a live application-database connection -- see README.md, "The read path".
# psycopg is installed only for the export step, and only when someone opts in.
db = ["psycopg[binary]>=3.2"]

[tool.uv]
package = false
